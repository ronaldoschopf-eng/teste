<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fotos do Vôlei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&text=%F0%9F%91%87&display=swap">
<style>
  /* Palco 1080 × 1920 (9:16). Conversa no estilo WhatsApp sobre degradê
     rosa pink → laranja, todo o texto em branco. O fotógrafo avisa,
     a pessoa pergunta "Onde?", ele aponta o link e envia o álbum, que
     carrega foto a foto. Peça de visual único (degradê). */
  :root {
    --pink: #ff2e93;
    --coral: #ff5a6e;
    --orange: #ff8a3d;
    --white: #ffffff;
    --font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif, 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji';
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body { background: #1a1a1a; color: var(--white); font-family: var(--font); overflow: hidden; }

  .viewport { position: fixed; inset: 0; display: grid; place-items: center; }
  .stage {
    position: relative; width: 1080px; height: 1920px; flex: none;
    transform: scale(var(--scale, 1)); transform-origin: center;
    background: linear-gradient(165deg, var(--pink) 0%, var(--coral) 48%, var(--orange) 100%);
    overflow: hidden; color: var(--white);
    -webkit-font-smoothing: antialiased;
  }
  .abs { position: absolute; }
  .i { width: 1em; height: 1em; flex: none; display: block; }

  /* luzes suaves que respiram no fundo */
  .glow { border-radius: 50%; filter: blur(60px); pointer-events: none; }
  .glow--a { width: 760px; height: 760px; left: -260px; top: 260px; background: rgba(255, 255, 255, .16); }
  .glow--b { width: 900px; height: 900px; right: -340px; bottom: -200px; background: rgba(255, 196, 120, .28); }

  /* cabeçalho da conversa */
  .head {
    left: 0; top: 0; width: 100%; height: 230px; box-sizing: border-box; padding: 92px 56px 0;
    display: flex; align-items: center; gap: 24px;
    border-bottom: 2px solid rgba(255, 255, 255, .35);
  }
  .head__back { font-size: 52px; margin-right: 2px; }
  .avatar {
    width: 92px; height: 92px; border-radius: 50%; box-sizing: border-box;
    border: 4px solid var(--white); display: grid; place-items: center; font-size: 50px; flex: none;
    background: rgba(255, 255, 255, .14);
  }
  .head__who { position: relative; flex: 1; height: 92px; }
  .head__name { position: absolute; left: 0; top: 4px; font-size: 42px; font-weight: 600; letter-spacing: -.015em; }
  .head__status { position: absolute; left: 0; top: 56px; font-size: 30px; font-weight: 400; opacity: .9; white-space: nowrap; }

  /* mensagens */
  .msg {
    box-sizing: border-box; max-width: 760px; width: max-content;
    padding: 22px 30px 16px; border-radius: 34px; font-size: 48px; line-height: 1.22; letter-spacing: -.015em;
  }
  .msg--in { left: 56px; background: rgba(255, 255, 255, .14); border: 3px solid rgba(255, 255, 255, .9); border-top-left-radius: 10px; transform-origin: 0 0; }
  .msg--out { right: 56px; background: rgba(90, 0, 40, .22); border: 3px solid transparent; border-top-right-radius: 10px; transform-origin: 100% 0; }
  .msg__meta { display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 26px; opacity: .85; margin-top: 4px; letter-spacing: 0; }
  .msg__meta .i { font-size: 34px; }

  .typing { width: 176px; height: 96px; padding: 0; display: flex; align-items: center; justify-content: center; gap: 14px; }
  .typing span { width: 16px; height: 16px; border-radius: 50%; background: var(--white); display: block; }

  /* álbum: 2 × 2, como o WhatsApp agrupa várias fotos */
  .album { padding: 10px; max-width: none; width: 704px; }
  .album__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { position: relative; aspect-ratio: 1; border-radius: 20px; overflow: hidden; background: rgba(0, 0, 0, .2); }
  .tile img { position: absolute; inset: -6%; width: 112%; height: 112%; object-fit: cover; }
  .tile__shade { position: absolute; inset: 0; background: rgba(40, 0, 20, .35); }
  .tile__ring { position: absolute; left: 50%; top: 50%; width: 132px; height: 132px; margin: -66px 0 0 -66px; }
  .tile__more { position: absolute; inset: 0; display: grid; place-items: center; font-size: 96px; font-weight: 600; letter-spacing: -.03em; background: rgba(40, 0, 20, .42); }
  .album .msg__meta { padding: 6px 12px 2px; }

  .controls {
    position: fixed; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 10px;
    padding: 8px 8px 8px 14px; border-radius: 999px; background: rgba(20, 20, 20, .85);
    border: 1px solid #333; font: 500 13px/1 var(--font); color: #9a9a9a;
    font-variant-numeric: tabular-nums;
  }
  .controls__track { position: relative; width: 90px; height: 3px; border-radius: 3px; background: #333; overflow: hidden; }
  .controls__track > span { position: absolute; inset: 0; background: var(--pink); transform-origin: 0 50%; transform: scaleX(0); }
  .controls button { font: inherit; color: #fff; background: transparent; border: 1px solid #444; border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  .controls button:hover { border-color: var(--pink); }
  .controls button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .is-clean .controls { display: none; }
  @media (max-width: 480px) { .controls__track { display: none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-camera" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 22 C8 19 10 17 13 17 H21 L25 11 H39 L43 17 H51 C54 17 56 19 56 22 V48 C56 51 54 53 51 53 H13 C10 53 8 51 8 48 Z"/>
      <circle cx="32" cy="34" r="10"/><circle cx="47" cy="25" r="1.6" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-back" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M40 12 L20 32 L40 52"/></symbol>
    <symbol id="i-ticks" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 34 L16 44 L36 22 M28 40 L32 44 L52 22"/></symbol>
    <symbol id="i-down" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M32 16 V46 M20 35 L32 47 L44 35"/></symbol>
  </defs>
</svg>

<main class="viewport">
  <div class="stage" id="stage" role="img" aria-label="Conversa animada: o fotógrafo avisa que as fotos do vôlei de ontem estão esperando, a pessoa pergunta onde, ele responde para clicar no link abaixo e envia um álbum de fotos que carrega e aparece, como no WhatsApp.">
    <div class="abs glow glow--a" id="glowA"></div>
    <div class="abs glow glow--b" id="glowB"></div>

    <header class="abs head" id="head">
      <svg class="i head__back"><use href="#i-back"/></svg>
      <div class="avatar"><svg class="i"><use href="#i-camera"/></svg></div>
      <div class="head__who">
        <div class="head__name">Ronaldo Schopf</div>
        <div class="head__status" id="stOnline">fotógrafo · online</div>
        <div class="head__status" id="stTyping">digitando…</div>
      </div>
    </header>

    <div class="abs msg msg--in typing" id="typing"><span></span><span></span><span></span></div>

    <div class="abs msg msg--in" id="m1">Suas fotos do vôlei de ontem estão te esperando<div class="msg__meta">18:40</div></div>
    <div class="abs msg msg--out" id="m2">Onde?<div class="msg__meta">18:41 <svg class="i" id="read"><use href="#i-ticks"/></svg></div></div>
    <div class="abs msg msg--in" id="m3">Clica no link aqui abaixo 👇<div class="msg__meta">18:41</div></div>
    <div class="abs msg msg--in album" id="m4">
      <div class="album__grid" id="grid"></div>
      <div class="msg__meta">18:42</div>
    </div>
  </div>
  <nav class="controls" aria-label="Controles da animação">
    <span id="time">0.0 s</span>
    <span class="controls__track"><span id="fill"></span></span>
    <button type="button" id="replay" aria-keyshortcuts="R">↻ Repetir</button>
  </nav>
</main>

<script>
/* Linha do tempo (ms) — tudo sai de render(t), então qualquer quadro pode
   ser reproduzido (?t=7000) e o vídeo é exportado sem quadros perdidos.
   0–500      cabeçalho da conversa entra
   740–1500   "digitando…" → "Suas fotos do vôlei de ontem estão te esperando"
   3020       a pessoa responde "Onde?" (lida em 3400)
   3780–4540  "digitando…" → "Clica no link aqui abaixo 👇"
   5300–8300  o álbum chega: as fotos baixam (anel de progresso) e aparecem
   ?clean esconde os controles · ?t=<ms> congela um quadro · R repete */
(() => {
  'use strict';
  const DURATION = 10500;
  const W = 1080, H = 1920;
  const BOTTOM = 1760;          // as mensagens se apoiam aqui e empurram as anteriores
  const GAP = 22;
  const MORE = 24;              // "+24" sobre a última foto do álbum
  /* Troque pelas suas fotos (jpg/png/webp), mantendo 4 itens. */
  const PHOTOS = ['fotos/1.jpg', 'fotos/2.jpg', 'fotos/3.jpg', 'fotos/4.jpg'];

  /* quando cada bolha entra e sai da pilha (ms) */
  const TYPING = [[740, 1500], [3780, 4540]];   // no compasso da trilha (1 tempo = 760 ms)
  const STACK = [
    { id: 'm1', at: 1500 },
    { id: 'm2', at: 3020 },
    { id: 'm3', at: 4540 },
    { id: 'm4', at: 5300 },
  ];
  const TILE_AT = 5650, TILE_STEP = 380, TILE_LOAD = 1170;   // fotos aparecem em colcheias: 6820, 7200, 7580, 7960

  const params = new URLSearchParams(location.search);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (params.has('clean')) document.documentElement.classList.add('is-clean');

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, p) => a + (b - a) * p;
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const E = {
    outCubic: (p) => 1 - Math.pow(1 - p, 3),
    outQuint: (p) => 1 - Math.pow(1 - p, 5),
    inOut: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
    outBack: (p) => { const c = 1.6; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); },
  };
  const $ = (id) => document.getElementById(id);
  const tf = (el, s) => { el.style.transform = s; };
  const op = (el, v) => { el.style.opacity = v.toFixed(3); };

  const tiles = [];
  const H_ = {};                // alturas medidas no build()

  function build() {
    const grid = $('grid');
    PHOTOS.forEach((src, i) => {
      const d = document.createElement('div');
      d.className = 'tile';
      d.innerHTML = `<img src="${src}" alt=""><div class="tile__shade"></div>
        <svg class="tile__ring" viewBox="0 0 132 132">
          <circle cx="66" cy="66" r="62" fill="rgba(40,0,20,.45)"/>
          <circle cx="66" cy="66" r="50" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="7"/>
          <circle class="arc" cx="66" cy="66" r="50" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"
            transform="rotate(-90 66 66)" stroke-dasharray="314.16" stroke-dashoffset="314.16"/>
          <use href="#i-down" x="38" y="38" width="56" height="56" color="#fff"/>
        </svg>` + (i === PHOTOS.length - 1 ? `<div class="tile__more">+${MORE}</div>` : '');
      grid.appendChild(d);
      tiles.push({
        img: d.querySelector('img'), shade: d.querySelector('.tile__shade'),
        ring: d.querySelector('.tile__ring'), arc: d.querySelector('.arc'), more: d.querySelector('.tile__more'),
      });
    });
    ['typing', ...STACK.map((s) => s.id)].forEach((id) => { H_[id] = $(id).offsetHeight; });
    return Promise.all(tiles.map((x) => x.img.decode().catch(() => {})));
  }

  /* peso de cada item na pilha (0 → 1 quando entra; 1 → 0 quando sai) */
  const grow = (t, a) => E.outCubic(seg(t, a, a + 380));

  function render(t) {
    /* fundo que respira */
    tf($('glowA'), `translate(${(Math.sin(t / 2600) * 60).toFixed(1)}px, ${(Math.cos(t / 3100) * 80).toFixed(1)}px)`);
    tf($('glowB'), `translate(${(Math.cos(t / 2900) * -70).toFixed(1)}px, ${(Math.sin(t / 2400) * 60).toFixed(1)}px)`);

    /* cabeçalho */
    const h = E.outCubic(seg(t, 0, 550));
    op($('head'), h);
    tf($('head'), `translateY(${((1 - h) * -60).toFixed(1)}px)`);
    const typingNow = TYPING.find(([a, b]) => t >= a - 100 && t < b + 100);
    const ty = TYPING.reduce((m, [a, b]) => Math.max(m, seg(t, a - 150, a) * (1 - seg(t, b - 50, b + 100))), 0);
    op($('stTyping'), ty);
    op($('stOnline'), 1 - ty);

    /* pilha: cada item empurra para cima tudo o que veio antes */
    const items = [];
    STACK.forEach((s, k) => {
      items.push({ id: s.id, w: grow(t, s.at) });
      const tw = TYPING.find(([, b]) => b === s.at);
      if (tw) items.splice(items.length - 1, 0, { id: 'typing', w: grow(t, tw[0]) * (1 - E.outCubic(seg(t, tw[1] - 60, tw[1] + 260))), typing: tw });
    });
    let y = BOTTOM;
    for (let k = items.length - 1; k >= 0; k--) {
      const it = items[k];
      if (it.typing && (t < it.typing[0] || t > it.typing[1] + 300)) continue;
      const el = $(it.id);
      const hgt = H_[it.id];
      el.style.top = (y - hgt).toFixed(1) + 'px';
      y -= (hgt + GAP) * it.w;
    }
    /* entrada de cada bolha: cresce a partir do canto do rabinho */
    STACK.forEach((s) => {
      const p = E.outBack(seg(t, s.at, s.at + 420));
      const el = $(s.id);
      op(el, seg(t, s.at, s.at + 160));
      tf(el, `scale(${lerp(0.72, 1, Math.max(0, p)).toFixed(4)})`);
    });
    const typ = $('typing');
    const tw = TYPING.find(([a, b]) => t >= a && t < b + 300);
    if (tw) {
      const pin = E.outBack(seg(t, tw[0], tw[0] + 380)), pout = seg(t, tw[1] - 60, tw[1] + 160);
      op(typ, seg(t, tw[0], tw[0] + 140) * (1 - pout));
      tf(typ, `scale(${(lerp(0.6, 1, Math.max(0, pin)) * (1 - 0.25 * pout)).toFixed(4)})`);
      [...typ.children].forEach((d, i) => {
        const b = Math.max(0, Math.sin((t - tw[0]) / 140 - i * 0.9));
        tf(d, `translateY(${(-10 * b).toFixed(1)}px)`);
        op(d, 0.4 + 0.6 * b);
      });
    } else op(typ, 0);

    /* "Onde?" lida: os tiques acendem */
    op($('read'), lerp(0.45, 1, seg(t, 3400, 3550)));

    /* álbum: cada foto baixa com anel de progresso e depois aparece nítida */
    tiles.forEach((x, i) => {
      const a = TILE_AT + i * TILE_STEP;
      const load = E.inOut(seg(t, a, a + TILE_LOAD));
      const rv = E.outCubic(seg(t, a + TILE_LOAD, a + TILE_LOAD + 380));
      x.arc.setAttribute('stroke-dashoffset', (314.16 * (1 - lerp(0.04, 1, load) * seg(t, a - 200, a))).toFixed(2));
      op(x.ring, 1 - rv);
      tf(x.ring, `scale(${(1 - 0.3 * rv).toFixed(4)})`);
      x.arc.setAttribute('transform', `rotate(${(-90 + seg(t, a - 200, a + TILE_LOAD) * 120).toFixed(1)} 66 66)`);
      x.img.style.filter = `blur(${lerp(22, 0, rv).toFixed(2)}px) saturate(${lerp(0.7, 1, rv).toFixed(3)})`;
      tf(x.img, `scale(${lerp(1.08, 1, rv).toFixed(4)})`);
      op(x.shade, 1 - rv);
      if (x.more) op(x.more, E.outCubic(seg(t, a + TILE_LOAD + 190, a + TILE_LOAD + 590)));
    });

    $('time').textContent = (Math.min(t, DURATION) / 1000).toFixed(1) + ' s';
    $('fill').style.transform = `scaleX(${clamp(t / DURATION).toFixed(4)})`;
  }

  /* --- palco, relógio e controles ------------------------------------ */
  const stage = $('stage');
  function fit() {
    const g = params.has('clean') ? 0 : 32;
    const s = Math.min((innerWidth - g) / W, (innerHeight - g) / H);
    stage.style.setProperty('--scale', s.toFixed(5));
  }
  addEventListener('resize', fit);
  fit();

  let start = 0, raf = 0;
  const frozen = params.has('t');
  const tick = (now) => { render(now - start); raf = requestAnimationFrame(tick); };
  const play = () => { cancelAnimationFrame(raf); start = performance.now(); raf = requestAnimationFrame(tick); };
  $('replay').addEventListener('click', play);
  addEventListener('keydown', (e) => { if (e.key === 'r' || e.key === 'R') play(); });

  let fontsOk = false;
  const ready = Promise.all([
    document.fonts.load('500 48px "Inter"'),
    document.fonts.load('600 42px "Inter"'),
    document.fonts.load('48px "Noto Color Emoji"', '👇').catch(() => []),
  ]).then((f) => { fontsOk = f[0].length > 0 && f[1].length > 0; })
    .catch(() => {}).then(build).then(() => {
      if (frozen) render(+params.get('t'));
      else if (reduce) render(DURATION);
      else play();
    });

  window.story = {
    duration: DURATION,
    ready,
    fontsOk: () => fontsOk,
    seek(ms) { cancelAnimationFrame(raf); render(ms); },
  };
})();
</script>
</body>
</html>
