<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>Fotos Disponíveis — Story</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/story.css">
</head>
<body>
  <main class="viewport">
    <!--
      Palco em 1080 × 1920 px (Instagram Stories). Tudo é posicionado nessa
      escala e o palco inteiro é reduzido proporcionalmente para caber na tela.
      Para trocar o evento, edite as linhas em .event__name e o link em .cta.
    -->
    <div class="stage" id="stage" role="img"
         aria-label="Story animado: 4º Festival Barra Vento de Capoeira — fotos disponíveis. Os registros do evento já podem ser acessados em ronaldo-schopf.fotto.com.br.">

      <!-- Brilho de fundo (segue o orbe) -->
      <span class="glow" data-ref="glow" aria-hidden="true"></span>
      <span class="glow glow--warm" data-ref="glowWarm" aria-hidden="true"></span>

      <!-- Círculos flutuantes (paralaxe de fundo) -->
      <div class="circles" data-ref="circles" aria-hidden="true"></div>

      <!-- Nome do evento (revelado na cena 01, sobe na cena 02) -->
      <div class="event" data-ref="event">
        <p class="event__name" data-ref="eventName">
          <span class="event__line">4º Festival</span>
          <span class="event__line">Barra Vento de Capoeira</span>
        </p>
      </div>

      <!-- CENAS 02–03 — porcentagem e status -->
      <div class="pct" data-ref="pct" aria-hidden="true"><span data-ref="pctNum">00</span><span class="pct__sign">%</span></div>

      <!-- Orbe + anel de progresso -->
      <div class="orbwrap" data-ref="orbwrap" aria-hidden="true">
        <svg class="ring" data-ref="ring" viewBox="0 0 400 400">
          <circle class="ring__track" data-ref="ringTrack" cx="200" cy="200" r="170"></circle>
          <circle class="ring__fill" data-ref="ringFill" cx="200" cy="200" r="170"></circle>
        </svg>
        <span class="ripple" data-ref="ripple1"></span>
        <span class="ripple" data-ref="ripple2"></span>
        <span class="orb" data-ref="orb"></span>
      </div>

      <div class="status" data-ref="status" aria-hidden="true">
        <span class="status__item" data-ref="statusBusy">PROCESSANDO REGISTROS<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span>
        <span class="status__item" data-ref="statusDone">PROCESSAMENTO CONCLUÍDO</span>
      </div>

      <!-- CENA 04 — revelação -->
      <h1 class="headline" data-ref="headline">
        <span class="hl" data-ref="hl1"><span class="hl__inner" data-ref="hl1Inner">Fotos</span></span>
        <span class="hl" data-ref="hl2"><span class="hl__inner" data-ref="hl2Inner">disponíveis<span class="hl__dot" data-ref="hl2Dot">.</span></span></span>
      </h1>

      <!-- CENA 05 — tela final -->
      <section class="final" data-ref="final">
        <p class="final__event" data-ref="finalEvent"><!-- preenchido a partir de .event__name --></p>
        <p class="final__copy" data-ref="copy">Os registros do evento já podem ser acessados.</p>
        <a class="cta" data-ref="cta" href="https://ronaldo-schopf.fotto.com.br/" target="_blank" rel="noopener">
          <span class="cta__label">ACESSE A GALERIA</span>
          <span class="cta__link">ronaldo-schopf.fotto.com.br</span>
        </a>
      </section>

      <span class="blackout" data-ref="blackout" aria-hidden="true"></span>
    </div>

    <!-- Controles de pré-visualização (fora do palco) -->
    <nav class="controls" data-ref="controls" aria-label="Controles da pré-visualização">
      <span class="controls__time" data-ref="ctrlTime">00.0 / 10.0</span>
      <span class="controls__track"><span data-ref="ctrlFill"></span></span>
      <button type="button" data-ref="btnPause" aria-keyshortcuts="Space">Pausar</button>
      <button type="button" data-ref="btnRestart" aria-keyshortcuts="R">↻ Reiniciar</button>
    </nav>
  </main>

  <script src="js/story.js"></script>
</body>
</html>
