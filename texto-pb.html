<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>Fotos Disponíveis — P&amp;B</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;700&display=swap">
  <link rel="stylesheet" href="css/texto-pb.css">
</head>
<body>
  <main class="viewport">
    <!--
      Palco em 1080 × 1920 px. Duas camadas idênticas: branco sobre preto e,
      por cima, preto sobre branco, revelada por um "obturador" circular.
    -->
    <div class="stage" id="stage" role="img" aria-label="Animação em preto e branco: Fotos disponíveis.">
      <div class="layer layer--dark" data-layer>
        <div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <h1 class="title">
          <span class="word" data-word="FOTOS"></span>
          <span class="word word--small" data-word="DISPONÍVEIS"></span>
        </h1>
        <span class="bar" aria-hidden="true"></span>
      </div>
      <span class="flash" aria-hidden="true"></span>
    </div>

    <nav class="controls" aria-label="Controles da pré-visualização">
      <span class="controls__time" data-ref="time">0.0 / 6.0</span>
      <button type="button" data-ref="pause" aria-keyshortcuts="Space">Pausar</button>
      <button type="button" data-ref="restart" aria-keyshortcuts="R">↻ Reiniciar</button>
    </nav>
  </main>

  <script src="js/texto-pb.js"></script>
</body>
</html>
