<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ronaldo Schopf Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Six+Caps&display=swap">
<style>
  /* Palco 1080 × 1350 (4:5). Cartão branco inclinado no centro sobre fundo
     preto, estrelas sobre o topo. Peça de visual único (escuro). */
  :root {
    --magenta: #b4407f;
    --white: #ffffff;
    --ink: #000000;
    --ui: #8f8090;
    --display: 'Six Caps', 'Bebas Neue', 'Oswald', Impact, 'Arial Narrow', sans-serif;
    --ui-font: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ink); color: var(--white); font-family: var(--ui-font); overflow: hidden; }

  .viewport { position: fixed; inset: 0; display: grid; place-items: center; }
  .stage {
    position: relative; width: 1080px; height: 1350px; flex: none;
    transform: scale(var(--scale, 1)); transform-origin: center;
    background: var(--ink);
    overflow: hidden;
  }
  .stage * { position: absolute; }
  .camera { inset: 0; transform-origin: 540px 800px; will-change: transform; }


  .card {
    left: 220px; top: 400px; width: 640px; height: 800px;
    background: var(--white); border-radius: 58px;
    transform-origin: 50% 50%;
      }
  .line { left: 60px; height: 0; overflow: visible; }
  .line__inner { left: 0; white-space: nowrap; transform-origin: 0 0; font-family: var(--display); color: var(--magenta); -webkit-text-stroke: .03em var(--magenta); }
  .line__inner > * { position: relative; display: inline-block; vertical-align: baseline; transform-origin: 50% 100%; }
  .caret { top: 0; left: 0; width: 9px; background: var(--magenta); border-radius: 3px; }
  .oglyph path { fill: var(--magenta); }

  .fx { inset: 0; width: 1080px; height: 1350px; overflow: visible; }
  .fx path { fill: var(--white); }
  .fx .halo { fill: url(#halo); stroke: none; }

  .controls {
    position: fixed; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 10px;
    padding: 8px 8px 8px 14px; border-radius: 999px; background: rgba(20, 15, 20, .82);
    border: 1px solid #2b2229; font: 500 13px/1 var(--ui-font); color: var(--ui);
    font-variant-numeric: tabular-nums;
  }
  .controls__track { position: relative; width: 90px; height: 3px; border-radius: 3px; background: #2b2229; overflow: hidden; }
  .controls__track > span { position: absolute; inset: 0; background: var(--magenta); transform-origin: 0 50%; transform: scaleX(0); }
  .controls button {
    font: inherit; color: var(--white); background: transparent; border: 1px solid #3a2e37;
    border-radius: 999px; padding: 8px 14px; cursor: pointer;
  }
  .controls button:hover { border-color: var(--magenta); }
  .controls button:focus-visible { outline: 2px solid var(--magenta); outline-offset: 2px; }
  .is-clean .controls { display: none; }
  @media (max-width: 480px) { .controls__track { display: none; } }
</style>
</head>
<body>
<main class="viewport">
  <div class="stage" id="stage" role="img" aria-label="Logo animada Ronaldo Schopf: um cartão branco inclinado recebe o nome em magenta, letra por letra, e a estrela da letra O se multiplica em cinco estrelas iguais acima da logo.">
    <div class="camera" id="camera">
      <div class="card" id="card">
        <div class="line" id="line1"><div class="line__inner"></div></div>
        <div class="line" id="line2"><div class="line__inner"></div></div>
        <span class="caret" id="caret"></span>
      </div>
      <svg class="fx" id="fx" viewBox="0 0 1080 1350" aria-hidden="true">
        <defs>
          <radialGradient id="halo"><stop offset="0" stop-color="#fff" stop-opacity=".55"></stop><stop offset="1" stop-color="#fff" stop-opacity="0"></stop></radialGradient>
        </defs>
        <circle class="halo" id="halo" r="1" cx="0" cy="0"></circle>
        <path id="morph"></path>
        <g id="stars"></g>
      </svg>
    </div>
  </div>
  <nav class="controls" aria-label="Controles da animação">
    <span id="time">0.0 s</span>
    <span class="controls__track"><span id="fill"></span></span>
    <button type="button" id="replay" aria-keyshortcuts="R">↻ Repetir</button>
  </nav>
</main>

<script>
/* Linha do tempo (ms) — tudo sai de render(t), então qualquer quadro pode
   ser reproduzido (?t=6500) e o vídeo é exportado sem quadros perdidos.
   0–2300   câmera recua e o cartão branco se abre e inclina
   2300–4900 RONALDO / SCHOPF datilografados; a estrela gira dentro do O
   5300–6500 uma cópia da estrela sobe, gira e encolhe
   6750–8000 ela se divide em 5 estrelas iguais acima da logo
   ?clean esconde os controles · ?t=<ms> congela um quadro · R repete */
(() => {
  'use strict';
  const DURATION = 9000;
  const SKEW = -11;                         // inclinação do cartão (graus)
  const CARD = { x: 220, y: 400, w: 640, h: 800 };
  const PAD_X = 60;
  const LINES = [                           // cap height de cada linha (px)
    { text: 'RONALDO', top: 50, cap: 300 },
    { text: 'SCHOPF', top: 374, cap: 372, star: 3 },
  ];
  const TEXT_W = CARD.w - PAD_X * 2;
  const STAR_FINAL = [                      // 5 estrelas em arco acima do cartão
    [372, 262], [486, 228], [600, 216], [714, 228], [828, 262],
  ];
  const STAR_C = [600, 262];                // onde a estrela se divide
  const STAR_H = 150;                       // altura de cada estrela final (px)
  const SKEW_K = Math.tan((SKEW * Math.PI) / 180);
  const starScale = () => STAR_H / 2 / oStar.ry;

  const params = new URLSearchParams(location.search);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (params.has('clean')) document.documentElement.classList.add('is-clean');

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, p) => a + (b - a) * p;
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const E = {
    outCubic: (p) => 1 - Math.pow(1 - p, 3),
    outQuint: (p) => 1 - Math.pow(1 - p, 5),
    inOutCubic: (p) => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
    outBack: (p, s = 1.7) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2),
  };
  const $ = (id) => document.getElementById(id);

  /* --- geometria das estrelas ---------------------------------------- */
  // Brilho de 4 pontas (o miolo do O): superelipse côncava.
  const sparkleR = (a, rx, ry) => {
    const p = 0.72;
    return Math.pow(Math.pow(Math.abs(Math.cos(a)) / rx, p) + Math.pow(Math.abs(Math.sin(a)) / ry, p), -1 / p);
  };
  const N = 200;
  const shapePath = (cx, cy, radius, rot = 0) => {
    let d = '';
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2, r = radius(a);
      const x = cx + Math.cos(a + rot) * r, y = cy + Math.sin(a + rot) * r;
      d += (i ? 'L' : 'M') + x.toFixed(2) + ' ' + y.toFixed(2);
    }
    return d + 'Z';
  };
  /* --- montagem das letras -------------------------------------------- */
  const letters = [];            // { el, line, at }
  let oStar = null;              // { cx, cy, rx, ry } no palco, com cartão em repouso
  let caretBase = [];

  function build() {
    const ctx = document.createElement('canvas').getContext('2d');
    ctx.font = '100px "Six Caps"';
    const mH = ctx.measureText('H');
    const capK = mH.actualBoundingBoxAscent / 100;
    const ascK = mH.fontBoundingBoxAscent / 100, descK = mH.fontBoundingBoxDescent / 100;

    LINES.forEach((L, li) => {
      const line = $('line' + (li + 1)), inner = line.firstElementChild;
      const size = L.cap / capK;
      line.style.top = L.top + 'px';
      inner.style.fontSize = size + 'px';
      inner.style.lineHeight = (ascK + descK) * size + 'px';
      inner.style.top = -(ascK - capK) * size + 'px';
      inner.style.letterSpacing = (0.012 * size) + 'px';
      inner.innerHTML = '';
      [...L.text].forEach((ch, i) => {
        let el;
        if (i === L.star) {
          ctx.font = size + 'px "Six Caps"';
          const m = ctx.measureText('O');
          const w = m.width, ink0 = -m.actualBoundingBoxLeft, ink1 = m.actualBoundingBoxRight;
          const iw = ink1 - ink0, h = L.cap, rx = iw / 2;
          const cx = ink0 + iw / 2, cy = h / 2;
          const outer = `M${ink0} ${rx}A${rx} ${rx} 0 0 1 ${ink1} ${rx}V${h - rx}A${rx} ${rx} 0 0 1 ${ink0} ${h - rx}Z`;
          el = document.createElement('span');
          el.innerHTML = `<svg class="oglyph" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="position:static;overflow:visible;display:block"><path fill-rule="evenodd" d="${outer}"></path></svg>`;
          el.oPath = el.querySelector('path');
          el.dataset.o = JSON.stringify({ outer, cx, cy, rx: iw * 0.44, ry: h * 0.45 });
        } else {
          el = document.createElement('span');
          el.textContent = ch;
        }
        inner.appendChild(el);
        letters.push({ el, line: li });
      });
      // estica a linha na horizontal para ocupar a largura do cartão
      inner.style.transform = '';
      const natural = inner.offsetWidth + 0.03 * size;
      inner.dataset.sx = TEXT_W / natural;
      inner.style.transform = `scaleX(${TEXT_W / natural})`;
    });

    // ritmo de datilografia: intervalos levemente irregulares (determinísticos)
    const jitter = [0, 30, -20, 40, -10, 20, -30, 10, 35, -25, 15, 0, -15];
    let t = 2350;
    letters.forEach((l, i) => {
      if (i === LINES[0].text.length) t += 300;   // retorno do carro
      l.at = t;
      t += 165 + jitter[i % jitter.length];
    });

    // posições do cursor (fim de cada letra, em coordenadas do cartão)
    caretBase = letters.map((l) => {
      const L = LINES[l.line], sx = +l.el.parentNode.dataset.sx;
      return { x: PAD_X + (l.el.offsetLeft + l.el.offsetWidth) * sx + 6, y: L.top, h: L.cap };
    });
    caretBase.start = { x: PAD_X, y: LINES[0].top, h: LINES[0].cap };

    // centro da estrela do O no palco (cartão em repouso, inclinado)
    const o = letters.find((l) => l.el.dataset && l.el.dataset.o);
    const od = JSON.parse(o.el.dataset.o);
    const sx = +o.el.parentNode.dataset.sx;
    const lx = PAD_X + (o.el.offsetLeft + od.cx) * sx;
    const ly = LINES[1].top + od.cy;
    const k = Math.tan((SKEW * Math.PI) / 180);
    oStar = { cx: CARD.x + lx + k * (ly - CARD.h / 2), cy: CARD.y + ly, rx: od.rx * sx, ry: od.ry, el: o.el, od };
  }

  /* --- quadro ---------------------------------------------------------- */
  const camera = $('camera'), card = $('card'), caret = $('caret');
  const morph = $('morph'), halo = $('halo'), starsG = $('stars');
  const starEls = STAR_FINAL.map(() => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    starsG.appendChild(p);
    return p;
  });

  function render(t) {
    // 1 · câmera recua e dá espaço ao cartão
    const cam = E.outQuint(seg(t, 150, 2300));
    const camS = lerp(2.7, 1, cam) * (1 + 0.035 * E.inOutCubic(seg(t, 7600, 9000)));
    const camR = lerp(-9, 0, cam);
    const camY = lerp(-120, 0, cam) + lerp(0, -18, E.inOutCubic(seg(t, 5200, 7800)));
    camera.style.transform = `translate(0px, ${camY.toFixed(2)}px) scale(${camS.toFixed(4)}) rotate(${camR.toFixed(3)}deg)`;

    // 2 · cartão: ponto → linha → retângulo → retângulo inclinado
    const open1 = E.outCubic(seg(t, 200, 750));
    const open2 = E.outBack(seg(t, 650, 1350), 1.2);
    const tilt = E.outBack(seg(t, 1150, 1900), 2);
    let jolt = 0;                                          // tranco do carro a cada tecla
    letters.forEach((l) => { const d = t - l.at; if (d >= 0 && d < 260) jolt += Math.exp(-d / 60) * Math.sin(d / 18) * 3; });
    card.style.opacity = t < 200 ? 0 : 1;
    card.style.transform =
      `translate(${jolt.toFixed(2)}px, 0) skewX(${(SKEW * tilt).toFixed(3)}deg) scale(${lerp(0.02, 1, open1).toFixed(4)}, ${lerp(0.012, 1, open2).toFixed(4)})`;
    card.style.borderRadius = lerp(4, 58, open2).toFixed(1) + 'px';

    // 3 · datilografia
    let last = -1;
    letters.forEach((l, i) => {
      const d = t - l.at;
      if (d < 0) { l.el.style.visibility = 'hidden'; return; }
      last = i;
      l.el.style.visibility = 'visible';
      const p = seg(d, 0, 220);
      const strike = E.outBack(p, 2.4);
      const y = lerp(-0.07, 0, strike) * LINES[l.line].cap;
      l.el.style.transform = `translateY(${y.toFixed(2)}px) scale(${lerp(1.25, 1, strike).toFixed(4)}, ${lerp(1.12, 1, strike).toFixed(4)})`;
      l.el.style.opacity = d < 30 ? 0.4 : 1;
    });

    // estrela dentro do O: gira e cresce quando a tecla bate, pulsa antes de sair
    if (oStar) {
      const d = t - oStar.el.__at;
      const spin = E.outBack(seg(d, 60, 700), 1.6);
      const pulse = Math.sin(Math.PI * seg(t, 5050, 5550)) * 0.16;
      const s = Math.max(0.001, spin) * (1 + pulse);
      const { od } = oStar;
      const cut = shapePath(od.cx, od.cy, (a) => sparkleR(a, od.rx * s, od.ry * s), (1 - spin) * Math.PI);
      oStar.el.oPath.setAttribute('d', d > 60 ? od.outer + cut : od.outer);
    }

    // cursor: pisca e acompanha a última letra; some ao terminar
    const cb = last < 0 ? caretBase.start : caretBase[last];
    const blink = (Math.floor(t / 380) % 2 === 0) || (last >= 0 && t - letters[last].at < 380);
    const caretOn = t > 1900 && t < letters[letters.length - 1].at + 700;
    caret.style.opacity = caretOn && blink ? 1 : 0;
    caret.style.height = cb.h + 'px';
    caret.style.transform = `translate(${cb.x.toFixed(1)}px, ${cb.y}px)`;

    // 4 · cópia da estrela sobe, gira, encolhe e se divide em 5 iguais a ela
    const rise = E.inOutCubic(seg(t, 5300, 6500));
    const split = seg(t, 6750, 8000);
    const skewM = (y) => `matrix(1, 0, ${SKEW_K.toFixed(4)}, 1, ${(-SKEW_K * y).toFixed(2)}, 0)`;
    // flip = giro em torno do eixo vertical (como moeda): só a largura varia
    const starD = (x, y, s, flip = 0) => shapePath(x, y, (a) => sparkleR(a, oStar.rx * s * Math.max(0.12, Math.abs(Math.cos(flip))), oStar.ry * s));
    if (oStar && t >= 5300 && split < 1) {
      const x = lerp(oStar.cx, STAR_C[0], rise) + Math.sin(Math.PI * rise) * 70;
      const y = lerp(oStar.cy, STAR_C[1], rise);
      const s = lerp(1, starScale(), rise) * (1 + 0.25 * Math.sin(Math.PI * rise));
      morph.setAttribute('d', starD(x, y, s, rise * Math.PI * 2));   // uma volta completa
      const c = E.inOutCubic(seg(rise, 0.4, 0.8));
      morph.style.fill = `rgb(${lerp(180, 255, c) | 0}, ${lerp(64, 255, c) | 0}, ${lerp(127, 255, c) | 0})`;
      morph.style.transform = skewM(y);
      morph.style.opacity = split > 0 ? 1 - seg(t, 6750, 6900) : 1;
      halo.setAttribute('cx', x); halo.setAttribute('cy', y);
      halo.setAttribute('r', (150 * rise * (1 - seg(t, 6750, 7100))).toFixed(1));
    } else {
      morph.setAttribute('d', '');
      halo.setAttribute('r', 0);
    }

    starEls.forEach((p, i) => {
      const order = [2, 1, 3, 0, 4].indexOf(i);           // do centro para fora
      const k = seg(t, 6750 + order * 110, 7500 + order * 110);
      if (!oStar || k <= 0) { p.setAttribute('d', ''); return; }
      const m = E.outBack(k, 1.6);
      const [fx, fy] = STAR_FINAL[i];
      const x = lerp(STAR_C[0], fx, E.outCubic(k)), y = lerp(STAR_C[1], fy, E.outCubic(k)) - Math.sin(Math.PI * k) * 40;
      const twinkle = t > 8200 ? 1 + 0.06 * Math.sin((t - 8200) / 260 + i * 1.3) : 1;
      const s = starScale() * Math.max(0.6, m) * twinkle;
      p.setAttribute('d', starD(x, y, s, (1 - E.outCubic(k)) * Math.PI));
      p.style.transform = skewM(y);
    });

    $('time').textContent = (Math.min(t, DURATION) / 1000).toFixed(1) + ' s';
    $('fill').style.transform = `scaleX(${clamp(t / DURATION).toFixed(4)})`;
  }

  /* --- palco, relógio e controles ------------------------------------ */
  const stage = $('stage');
  function fit() {
    const g = params.has('clean') ? 0 : 32;
    const s = Math.min((innerWidth - g) / 1080, (innerHeight - g) / 1350);
    window.__scale = s;
    stage.style.setProperty('--scale', s.toFixed(5));
  }
  addEventListener('resize', fit);
  fit();

  let start = 0, raf = 0, frozen = params.has('t');
  const tick = (now) => { render(now - start); raf = requestAnimationFrame(tick); };
  const play = () => { cancelAnimationFrame(raf); start = performance.now(); raf = requestAnimationFrame(tick); };
  $('replay').addEventListener('click', play);
  addEventListener('keydown', (e) => { if (e.key === 'r' || e.key === 'R') play(); });

  let fontsOk = false;
  const ready = document.fonts.load('100px "Six Caps"').then((f) => { fontsOk = f.length > 0; })
    .catch(() => {}).then(() => {
      build();
      letters.forEach((l) => { l.el.__at = l.at; });
      if (frozen) render(+params.get('t'));
      else if (reduce) render(DURATION);
      else play();
    });

  window.story = {
    duration: DURATION,
    ready,
    fontsOk: () => fontsOk,
    seek(ms) { cancelAnimationFrame(raf); render(ms); },
  };
})();
</script>
</body>
</html>
